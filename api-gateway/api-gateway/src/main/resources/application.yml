server:
  port: 8084

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/${segment}

        - id: equipment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/equipment/**
          filters:
            - RewritePath=/api/equipment/(?<segment>.*), /api/equipment/${segment}

        - id: borrow-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/borrow/**
          filters:
            - RewritePath=/api/borrow/(?<segment>.*), /api/borrow/${segment}

